!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لعنة الغابة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b08;color:white;font-family:Arial;text-align:center}
#game{height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#07100e,#203b24 65%,#030604)}
#moon{position:absolute;top:9%;right:15%;width:55px;height:55px;border-radius:50%;background:#e1e9c8;box-shadow:0 0 35px #fff8}
.tree{position:absolute;bottom:0;width:0;height:0;border-left:48px solid transparent;border-right:48px solid transparent;border-bottom:190px solid #07150d}
#path{position:absolute;bottom:0;left:20%;width:60%;height:65%;background:#343d29;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
#beam{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 65%,#d9e9a544,transparent 65%)}
#player{position:absolute;bottom:23%;left:50%;transform:translateX(-50%);font-size:45px;z-index:3}
#monster{position:absolute;top:30%;left:15%;font-size:60px;filter:drop-shadow(0 0 12px red)}
#hud{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:5px}
.pill{background:#000b;padding:10px;border-radius:10px}
#story{position:absolute;top:17%;left:8%;right:8%;font-size:18px;text-shadow:0 2px 5px black}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;z-index:5}
button{background:#193322;color:white;border:1px solid #a7c49c;border-radius:12px;padding:13px;font-size:16px}
#start,#end{position:absolute;inset:0;background:#020604ed;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#end{display:none}
h1{color:#c0e0a5;font-size:38px}
</style>
</head>
<body>
<div id="game">
<div id="moon"></div>
<div id="path"></div>
<div id="trees"></div>
<div id="beam"></div>
<div id="hud">
<div class="pill">🔦 الكشاف: <span id="battery">100</span>%</div>
<div class="pill">👣 التقدم: <span id="distance">0</span>%</div>
</div>
<div id="story">أنت وأحمد وفهد عالقون في الغابة الملعونة!</div>
<div id="player">🚶🏻</div>
<div id="monster">👹</div>
<div id="controls">
<button onclick="move(-1)">◀ يسار</button>
<button onclick="move(1)">يمين ▶</button>
<button onclick="move(0)">🏃 تقدم</button>
<button onclick="flash()">🔦 تشغيل الكشاف</button>
</div>
<div id="start">
<h1>🌲 لعنة الغابة 🌲</h1>
<p>غابة مظلمة، وأصوات غريبة تلاحقك...</p>
<p>اعثر على المخرج قبل أن يمسك بك الوحش!</p>
<button onclick="begin()">▶ ابدأ اللعب</button>
</div>
<div id="end">
<h1 id="endTitle"></h1>
<p id="endText"></p>
<button onclick="location.reload()">🔄 العب من جديد</button>
</div>
</div>
<script>
let progress=0,pos=0,battery=100,running=false,monster=0,light=true;
const $=id=>document.getElementById(id);
for(let i=0;i<28;i++){
let t=document.createElement('div');
t.className='tree';
t.style.left=(i%2===0?Math.random()*17:83+Math.random()*17)+'%';
t.style.transform='scale('+(0.5+Math.random()*.8)+')';
t.style.opacity=.6+Math.random()*.4;
$('trees').appendChild(t);
}
function begin(){
$('start').style.display='none';
running=true;
$('story').textContent='أحمد: لازم نلقى طريق الخروج!';
}
function move(d){
if(!running)return;
if(d===0)progress+=8;
else{pos=Math.max(-2,Math.min(2,pos+d));progress+=3;}
monster+=Math.random()*7+2;
$('player').style.left=(50+pos*13)+'%';
$('distance').textContent=Math.min(100,progress);
$('monster').style.left=Math.max(5,Math.min(80,15+monster))+'%';
if(progress>=100){finish(true);return;}
if(monster>=70){finish(false);return;}
if(progress>40)$('story').textContent='فهد: الوحش قريب! اركضوا!';
else if(progress>15)$('story').textContent='تسمع خطوات خلف الأشجار...';
}
function flash(){
if(!running)return;
light=!light;
$('beam').style.background=light?'radial-gradient(ellipse at 50% 65%,#d9e9a555,transparent 65%)':'transparent';
battery=Math.max(0,battery-10);
$('battery').textContent=battery;
$('story').textContent=light?'الكشاف مضاء!':'الظلام يحيط بك...';
if(battery===0){light=false;$('beam').style.background='transparent';}
}
function finish(win){
running=false;
$('end').style.display='flex';
$('endTitle').textContent=win?'🏆 نجوت من الغابة!':'👹 أمسك بك الوحش!';
$('endText').textContent=win?'وجدت المخرج أخيرًا!':'حاول مرة ثانية وواصل التقدم نحو المخرج.';
}
</script>
</body>
</html>
